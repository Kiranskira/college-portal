<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Teacher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }
        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0, 53, 102, 0.87);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffcc00 !important;
            font-size: 1.4rem;
        }
        .navbar-nav .nav-link {
            font-weight: 600;
            text-transform: uppercase;
            color: #e0e0e0 !important;
            margin-right: 1rem;
            transition: color 0.3s;
        }
        .navbar-nav .nav-link.active, .navbar-nav .nav-link:hover {
            color: #ffcc00 !important;
            text-decoration: underline;
            transform: translateY(-2px);
        }
        .center-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 53, 102, 0.13);
            padding: 2.5rem 2rem;
            max-width: 600px;
            width: 100%;
        }
        h3 {
            font-weight: 800;
            color: #143C6A;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: .5px;
        }
        .form-control, .form-select, textarea {
            border-radius: 12px;
            border: 1px solid #c7e6fb;
            background: #eef6fc;
            font-size: 1.13rem;
            color: #25445c;
            box-shadow: none;
            margin-bottom: 1rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .form-control:focus, .form-select:focus, textarea:focus {
            border-color: #0d6efd;
            background: #eef7ff;
            box-shadow: 0 0 0 2px #e3f1ff;
        }
        textarea {
            min-height: 90px;
            resize: vertical;
        }
        .form-label {
            font-weight: 600;
            color: #2069b0;
            margin-bottom: 0.35rem;
        }
        .form-control::placeholder, textarea::placeholder {
            color: #6c889c;
            font-size: 1.08rem;
            opacity: 1;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #188aff 60%, #143c6a 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 20px;
            height: 48px;
            box-shadow: 0 4px 16px rgba(24, 138, 255, 0.13);
            margin-top: .5rem;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #143c6a 40%, #188aff 100%);
            box-shadow: 0 8px 32px rgba(24, 138, 255, 0.17);
        }
        .form-card img {
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(24,138,255,.08);
            margin-right: .5rem;
        }
        @media (max-width: 575.98px) {
            .form-card {
                max-width: 97vw;
                min-width: unset;
                padding: 1.4rem 1rem 1.1rem 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'landing' %}">Student-Course Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'teacher_dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger fw-semibold px-4 py-2 rounded-pill shadow-sm" 
                        href="{% url 'logout_fun' %}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

{% if messages %}
<div class="container mt-3">
    {% for message in messages %}
        <div 
            class="alert {% if message.tags == 'success' %}alert-success
                        {% elif message.tags == 'error' %}alert-danger
                        {% elif message.tags == 'warning' %}alert-warning
                        {% else %}alert-info{% endif %} alert-dismissible fade show" 
            role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% endif %}

    <div class="center-wrap">
        <div class="form-card shadow">
            <h3>Edit Teacher Details</h3>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" name="fname" value="{{ teacher.fname }}" class="form-control" placeholder="First Name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text" name="lname" value="{{ teacher.lname }}" class="form-control" placeholder="Last Name" required>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" name="username" value="{{ teacher.username }}" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <textarea name="address" class="form-control" placeholder="Address" required>{{ teacher.address }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="number" name="age" value="{{ teacher.age }}" class="form-control" placeholder="Age" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="email" name="email" value="{{ teacher.email }}" class="form-control" placeholder="Email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" name="phone" value="{{ teacher.phone }}" class="form-control" placeholder="Phone Number" required>
                </div>
                <div class="mb-3">
                    <label for="course" class="form-label">Select Course</label>
                    <select name="course" id="course" class="form-select" required>
                        <option value="">-- Select a Course --</option>
                        {% for c in courses %}
                            <option value="{{ c.id }}" {% if teacher.course.id == c.id %}selected hidden {% endif %}>
                                {{ c.coursename }} - ₹{{ c.fees }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Profile Image</label><br>
                    {% if teacher.image %}
                        <img src="{{ teacher.image.url }}" alt="Profile" class="rounded mb-2" width="80" height="80">
                    {% endif %}
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>
                <button type="submit" class="btn btn-gradient w-100">Update</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
