<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }
        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0, 53, 102, 0.87);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffcc00 !important;
            font-size: 1.4rem;
        }
        .navbar-nav .nav-link {
            font-weight: 600;
            text-transform: uppercase;
            color: #e0e0e0 !important;
            margin-right: 1rem;
            transition: color 0.3s;
        }
        .navbar-nav .nav-link.active, .navbar-nav .nav-link:hover {
            color: #ffcc00 !important;
            text-decoration: underline;
            transform: translateY(-2px);
        }
        .center-wrap {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 53, 102, 0.13);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 450px;
            width: 100%;
        }
        h3 {
            font-weight: 800;
            color: #143C6A;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1.3rem;
            letter-spacing: .5px;
        }
        .form-control {
            border-radius: 12px;
            border: 1px solid #c7e6fb;
            background: #eef6fc;
            font-size: 1.13rem;
            color: #25445c;
            box-shadow: none;
            margin-bottom: 1rem;
            padding-left: 1rem;
            padding-right: 1rem;
            height: 48px;
        }
        .form-control:focus {
            border-color: #0d6efd;
            background: #eef7ff;
            box-shadow: 0 0 0 2px #e3f1ff;
        }
        .form-label {
            font-weight: 600;
            color: #2069b0;
            margin-bottom: 0.35rem;
        }
        .form-control::placeholder {
            color: #6c889c;
            font-size: 1.08rem;
            opacity: 1;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #188aff 60%, #143c6a 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 20px;
            height: 48px;
            box-shadow: 0 4px 16px rgba(24, 138, 255, 0.13);
            margin-top: .3rem;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #143c6a 40%, #188aff 100%);
            box-shadow: 0 8px 32px rgba(24, 138, 255, 0.17);
        }
        @media (max-width: 575.98px) {
            .form-card {
                max-width: 97vw;
                padding: 1.4rem 1rem 1rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'landing' %}">Student-Course Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
            <li class="nav-item ms-2">
            <a class="btn btn-warning fw-semibold px-4 py-2 rounded-pill text-dark shadow-sm" href="{% url 'teacher_signup' %}">Signup</a>
          </li>
            </ul>
            </div>
        </div>
    </nav>

    <!-- ✅ Message pop-up section -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <!-- ✅ End message section -->

    <!-- Login Form -->
    <div class="center-wrap">
        <div class="form-card shadow">
            <h3>Login</h3>
            <form action="{% url 'loginfun' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don’t have an account? 
                <a href="{% url 'teacher_signup' %}" class="text-decoration-none fw-semibold text-primary">Register here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
