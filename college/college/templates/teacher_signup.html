<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Teacher Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }
        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0, 53, 102, 0.87);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffcc00 !important;
            font-size: 1.4rem;
        }
        .navbar-nav .nav-link {
            font-weight: 600;
            text-transform: uppercase;
            color: #e0e0e0 !important;
            margin-right: 1rem;
            transition: color 0.3s ease;
        }
        .navbar-nav .nav-link.active,
        .navbar-nav .nav-link:hover {
            color: #ffcc00 !important;
            text-decoration: underline;
            transform: translateY(-2px);
        }
        .center-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 53, 102, 0.13);
            padding: 2.6rem 2.4rem;
            max-width: 600px;
            width: 100%;
        }
        h3 {
            font-weight: 800;
            color: #143C6A;
            font-size: 2rem;
            margin-bottom: 2rem;
            letter-spacing: .5px;
            text-align: center;
        }
        .form-control,
        .form-select,
        textarea {
            border-radius: 12px;
            border: 1px solid #c7e6fb;
            background: #eef6fc;
            font-size: 1.13rem;
            color: #25445c;
            box-shadow: none;
            margin-bottom: 1.3rem;
            padding-left: 1rem;
            padding-right: 1rem;
            height: 48px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
            padding-top: 10px;
        }
        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: #0d6efd;
            background: #eef7ff;
            box-shadow: 0 0 0 2px #e3f1ff;
        }
        .form-label {
            font-weight: 600;
            color: #2069b0;
            margin-bottom: 0.5rem;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #188aff 60%, #143c6a 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 20px;
            height: 48px;
            box-shadow: 0 4px 18px rgba(24, 138, 255, 0.15);
            margin-top: 0.2rem;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #143c6a 50%, #188aff 100%);
            box-shadow: 0 8px 32px rgba(24, 138, 255, 0.22);
        }
        .alert {
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.2px;
            padding: 0.9rem 1.2rem;
        }
        @media (max-width: 575.98px) {
            .form-card {
                max-width: 95vw;
                padding: 1.8rem 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'landing' %}">Student-Course Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item ms-2">
                        <a class="btn btn-warning fw-semibold px-4 py-2 rounded-pill text-dark shadow-sm" href="{% url 'loginfun' %}">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ✅ Message pop-up section -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <!-- ✅ End message section -->

    <div class="center-wrap">
        <div class="form-card shadow">
            <h3>Teacher Registration</h3>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" name="fname" class="form-control" placeholder="First Name" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text" name="lname" class="form-control" placeholder="Last Name" required />
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required />
                </div>
                <div class="mb-3">
                    <textarea name="address" class="form-control" placeholder="Address"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="number" name="age" class="form-control" placeholder="Age" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email" required />
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" name="phone" class="form-control" placeholder="Phone Number" required />
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required />
                </div>
                <div class="mb-3">
                    <input type="password" name="confirmpw" class="form-control" placeholder="Confirm Password" required />
                </div>
                <div class="mb-3">
                    <label for="course" class="form-label">Select Course</label>
                    <select name="course" id="course" class="form-select" required>
                        <option value="">-- Select a Course --</option>
                        {% for c in courses %}
                        <option value="{{ c.id }}">{{ c.coursename }} - ₹{{ c.fees }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Profile Image</label>
                    <input type="file" name="image" class="form-control" accept="image/*" required />
                </div>
                <button type="submit" class="btn btn-gradient w-100">Register</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
