<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }
        /* Navbar styling */
        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0, 53, 102, 0.87);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffcc00 !important;
            font-size: 1.4rem;
        }
        .navbar-nav .nav-link {
            font-weight: 600;
            text-transform: uppercase;
            color: #e0e0e0 !important;
            margin-right: 1rem;
            transition: color 0.3s;
        }
        .navbar-nav .nav-link.active, .navbar-nav .nav-link:hover {
            color: #ffcc00 !important;
            text-decoration: underline;
            transform: translateY(-2px);
        }
        .center-wrap {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 53, 102, 0.18);
            padding: 2.5rem 2rem 2rem 2rem;
            min-width: 340px;
            max-width: 400px;
        }
        .form-card h2 {
            font-weight: 800;
            color: #143C6A;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: .5px;
        }
        .form-control {
            border-radius: 12px;
            border: 1px solid #c7e6fb;
            background: #eef6fc;
            font-size: 1.18rem;
            color: #25445c;
            box-shadow: none;
            margin-bottom: 1rem;
            padding-left: 1rem;
            padding-right: 1rem;
            height: 48px;
        }
        .form-control::placeholder {
            color: #6c889c;
            font-size: 1.15rem;
            opacity: 1;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #188aff 60%, #143c6a 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 20px;
            height: 48px;
            box-shadow: 0 4px 18px rgba(24, 138, 255, 0.14);
            margin-top: .5rem;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #143c6a 40%, #188aff 100%);
            box-shadow: 0 8px 32px rgba(24, 138, 255, 0.17);
        }
        @media (max-width: 575.98px) {
            .form-card {
                max-width: 98vw;
                padding: 1.8rem 1rem 1.5rem 1rem;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'landing' %}">Student-Course Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if current_page == 'student' %}active{% endif %}" href="{% url 'student' %}">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_page == 'course' %}active{% endif %}" href="{% url 'course' %}">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_page == 'show_details' %}active{% endif %}" href="{% url 'show_details' %}">Show Details</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_page == 'admin_dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

{% if messages %}
<div class="container mt-3">
    {% for message in messages %}
        <div 
            class="alert {% if message.tags == 'success' %}alert-success
                        {% elif message.tags == 'error' %}alert-danger
                        {% elif message.tags == 'warning' %}alert-warning
                        {% else %}alert-info{% endif %} alert-dismissible fade show" 
            role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% endif %}

    <div class="center-wrap">
        <div class="form-card">
            <h2>Add Course</h2>
            <form method="POST" action="{% url 'add_course' %}">
                {% csrf_token %}
                <input type="text" class="form-control" name="course" placeholder="Course Name" required>
                <input type="number" class="form-control" name="fee" placeholder="Course Fees" required>
                <button type="submit" class="btn btn-gradient w-100">Add</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
